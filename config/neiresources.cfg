# Configuration file

compat {
    # Keep NEI Resources mob pages active alongside MobsInfo mob pages when MobsInfo is installed. [default: true]
    B:coexistWithMobsInfo=true

    # Experimental/debug-only: also push normalized NEI Resources drop data into MobsInfo. Disabled by default and never suppresses NEI Resources pages. [default: false]
    B:enableExperimentalMobsInfoExport=false

    # Enable optional MobsInfo detection and coexistence logging when MobsInfo is installed. [default: true]
    B:enableMobsInfoIntegration=true

    # Deprecated compatibility option retained for existing configs; NEI Resources no longer suppresses its mob pages for MobsInfo. [default: false]
    B:preferMobsInfoViewer=false
}


general {
    # Enable extra NEI Resources debug logging and temporary debug-only entries. [default: false]
    B:debugLogging=false
}


modules {
    # Enable scanner-backed block drop resource information. [default: true]
    B:enableAutoBlockDropInfo=true

    # Enable scanner-backed entity spawn egg resource information. [default: true]
    B:enableAutoEntitySpawnInfo=true

    # Enable scanner-backed loot resource information when a safe scanner is available. [default: true]
    B:enableAutoLootInfo=true

    # Enable scanner-backed ore dictionary resource information. [default: true]
    B:enableAutoOreDictionaryInfo=true

    # Enable scanner-backed furnace smelting resource information. [default: true]
    B:enableAutoSmeltingInfo=true

    # Enable the dungeon loot resource module. [default: true]
    B:enableDungeonLoot=true

    # Enable the mob drops resource module. [default: true]
    B:enableMobDrops=true

    # Enable the ore information resource module. [default: true]
    B:enableOreInfo=true

    # Enable the world generation information resource module. [default: true]
    B:enableWorldGenInfo=true
}


