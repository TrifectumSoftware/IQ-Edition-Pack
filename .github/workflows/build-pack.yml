name: build-pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      zip-path: ${{ steps.build.outputs.zip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read pack version
        id: version
        shell: bash
        run: |
          ver=$(cat pack-tools/VERSION)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Verify git-lfs objects pulled
        shell: pwsh
        run: |
          git lfs ls-files | Select-Object -First 5
          $count = (git lfs ls-files | Measure-Object).Count
          Write-Host "LFS files: $count"

      - name: Assemble instance and build zip
        id: build
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "IQ-Edition-Pack.zip"
          & "${{ github.workspace }}\pack-tools\assemble-pack.ps1" -RepoRoot "${{ github.workspace }}" -Output $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Edition-Pack
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "IQ Edition v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            Automatic per-commit prerelease build of commit `${{ github.sha }}`.

            - Mod-director bundle: config/mod-director/mods.bundle.json (auto-downloads at launch)
            - Manual mods tracked in-repo
            - Includes libraries/lwjgl3ify-3.0.31-forgePatches.jar (local artifact)
          files: ${{ steps.build.outputs.zip }}
          prerelease: true
          fail_on_unmatched_files: true
